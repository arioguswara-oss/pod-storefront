name: Theme and package checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint PHP
        run: find themes plugins tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript
        run: |
          node --check themes/pod-store-theme/assets/js/navigation.js
          node --check plugins/pod-simple-checkout/assets/product.js
      - name: Package tests and build
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/build.py
          git diff --check
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: wordpress-installable-packages
          path: |
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: cd tests && npx playwright install --with-deps chromium
      - name: Install built ZIPs into disposable loopback fixture
        run: POD_ALLOW_TEST_FIXTURE=1 sh tests/setup.sh
      - name: Responsive catalog, variations and cart checks
        run: |
          docker compose -f tests/compose.yml exec -T wordpress php /fixtures/.downloads/wp-cli.phar --allow-root plugin deactivate pod-simple-checkout
          node tests/e2e.cjs
          docker compose -f tests/compose.yml exec -T wordpress php /fixtures/.downloads/wp-cli.phar --allow-root plugin activate pod-simple-checkout
      - name: Plugin HTTP security, validation and idempotency
        run: |
          node tests/plugin-api.cjs
          node tests/plugin-concurrency.cjs
      - name: Plugin browser, native checkout and compatibility checks
        run: node tests/plugin-browser.cjs
      - name: Plugin lifecycle and existing-record preservation
        run: node tests/plugin-lifecycle.cjs
      - name: Rollback and standalone theme checks
        run: sh tests/rollback.sh
      - name: Capture fixture diagnostics
        if: always()
        run: docker compose -f tests/compose.yml logs --no-color > tests/results/containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: tests/results/
      - name: Remove only the disposable fixture
        if: always()
        run: docker compose -f tests/compose.yml down -v
